<div id="front" class="kanji-style"></div>

<script>
  function updateFront() {
    const input = "{{Content}}";
    if (!input || !input.includes("|")) {
      console.error("Invalid input format");
      return;
    }
    const fields = input.split("|").reduce((acc, field) => {
      const [key, value] = field.split(":");
      acc[key] = value;
      return acc;
    }, {});
    document.getElementById("front").innerText = fields.Kanji || "";
  }
  updateFront();
  onUpdateHook.push(updateFront);
</script>
