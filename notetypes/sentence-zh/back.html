<div id="data" style="display:none">{{text:Content}}</div>

<div id="front" class="sentence-style"></div>
<div id="audio" class="audio-slot">{{Audio}}</div>

<div class="spacer"></div>

<div id="back">
  <div id="translation"></div>
  <div id="source"></div>
  <div id="notes"></div>
</div>

<script>
const HANZI_REGEX = /[一-鿿㐀-䶿]/;

function parseContent() {
  const raw = (document.getElementById("data").textContent || "").trim();
  return Object.fromEntries(
    raw.split("|").map(pair => {
      const i = pair.indexOf(":");
      return i === -1 ? [pair.trim(), ""] : [pair.slice(0, i).trim(), pair.slice(i + 1).trim()];
    })
  );
}

// Ruby-annotate every hanzi with the next pinyin syllable; other chars pass through.
function withPinyin(text, syllables) {
  let out = "";
  let i = 0;
  for (const ch of text) {
    if (HANZI_REGEX.test(ch)) {
      out += `<ruby>${ch}<rt>${syllables[i] || ""}</rt></ruby>`;
      i++;
    } else {
      out += ch;
    }
  }
  return out;
}

function updateCard() {
  const fields = parseContent();
  const sentence = (fields.Sentence || "").trim();
  const syllables = fields.Pinyin ? fields.Pinyin.trim().split(/\s+/) : [];

  document.getElementById("front").innerHTML = withPinyin(sentence, syllables);
  document.getElementById("translation").innerText = fields.Translation || "";

  const source = document.getElementById("source");
  source.innerText = fields.Source || "";
  source.style.display = fields.Source ? "" : "none";

  // Words / WordPinyin / WordMeanings are optional, comma-separated and parallel.
  const words = fields.Words ? fields.Words.split(",") : [];
  const wordPinyin = fields.WordPinyin ? fields.WordPinyin.split(",") : [];
  const meanings = fields.WordMeanings ? fields.WordMeanings.split(",") : [];

  document.getElementById("notes").innerHTML = words
    .map((word, i) => {
      const p = (wordPinyin[i] || "").trim().split(/\s+/);
      return `<span class="word-section">${withPinyin(word.trim(), p)} ➔ ${meanings[i] || ""}</span><br>`;
    })
    .join("");
}

updateCard();
if (typeof onUpdateHook !== "undefined") onUpdateHook.push(updateCard);
</script>
