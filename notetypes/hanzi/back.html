<div id="content-src" style="display:none;">{{Content}}</div>

<div id="hanzi-ruby" class="hanzi-style"></div>
<div class="spacer"></div>

<div id="back">
  <div id="meaning" class="meaning-style"></div>
  <div id="words" class="words-style"></div>
  <div id="sentence" class="sentence-style"></div>
  <div id="sentence-meaning" class="sentence-meaning-style"></div>
  <div id="radicals" class="radicals-style"></div>
</div>

<script>
(function () {
  var HANZI_RE = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/;

  function parseContent() {
    var raw = (document.getElementById("content-src").textContent || "")
      .replace(/ /g, " ")
      .trim();
    var fields = {};
    raw.split("|").forEach(function (pair) {
      var idx = pair.indexOf(":");
      if (idx > 0) {
        fields[pair.slice(0, idx).trim()] = pair.slice(idx + 1).trim();
      }
    });
    return fields;
  }

  // "你好" + "nǐ hǎo" -> ruby with one syllable above each hanzi.
  // Non-hanzi characters (punctuation, latin) pass through without ruby.
  function rubyize(text, pinyin) {
    var syllables = (pinyin || "").split(/\s+/).filter(Boolean);
    var i = 0;
    var out = "";
    Array.from(text || "").forEach(function (ch) {
      if (HANZI_RE.test(ch)) {
        var py = syllables[i++] || "";
        out += py
          ? "<ruby>" + ch + "<rt>" + py + "</rt></ruby>"
          : ch;
      } else {
        out += ch;
      }
    });
    return out;
  }

  function splitList(value) {
    return (value || "").split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function setVisible(id, visible) {
    document.getElementById(id).style.display = visible ? "" : "none";
  }

  function render() {
    var f = parseContent();
    var hanzi = f.Hanzi || f.Kanji || "?";

    document.getElementById("hanzi-ruby").innerHTML = rubyize(hanzi, f.Pinyin);

    var meaning = f.Meaning || f.Translation || "";
    document.getElementById("meaning").innerText = meaning;
    setVisible("meaning", !!meaning);

    var words = splitList(f.Words || f.WordExamples);
    var wordPinyin = splitList(f.WordPinyin);
    var wordMeanings = splitList(f.WordMeanings || f.WordTranslations);
    var wordsHTML = words.map(function (word, i) {
      var ruby = rubyize(word, wordPinyin[i]);
      var gloss = wordMeanings[i] ? " ➔ " + wordMeanings[i] : "";
      return '<span class="word-item">' + ruby + gloss + "</span>";
    }).join("<br>");
    document.getElementById("words").innerHTML = wordsHTML;
    setVisible("words", words.length > 0);

    var sentence = f.Sentence || "";
    document.getElementById("sentence").innerHTML = rubyize(sentence, f.SentencePinyin);
    setVisible("sentence", !!sentence);

    var sentenceMeaning = f.SentenceMeaning || "";
    document.getElementById("sentence-meaning").innerText = sentenceMeaning;
    setVisible("sentence-meaning", !!sentenceMeaning);

    var radicals = f.Radicals || "";
    document.getElementById("radicals").innerText = radicals ? "Radicals: " + radicals : "";
    setVisible("radicals", !!radicals);
  }

  render();
  if (typeof onUpdateHook !== "undefined") onUpdateHook.push(render);
})();
</script>
